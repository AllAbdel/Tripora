<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Tripora">
  <title>Tripora</title>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb0ff"/>
      <stop offset="0.55" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#0066f0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#dbe8f7"/>
    </linearGradient>
    <filter id="ombre" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#003a7d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fond)"/>

  <!-- Trois étoiles : la note du groupe, au-dessus de la destination -->
  <g fill="#f5b301" transform="translate(0 10)">
    <path d="M176 122 l7.4 15 16.6 2.4 -12 11.7 2.8 16.5 -14.8-7.8 -14.8 7.8 2.8-16.5 -12-11.7 16.6-2.4z"/>
    <path d="M256 100 l9.6 19.4 21.4 3.1 -15.5 15.1 3.7 21.3 -19.2-10.1 -19.2 10.1 3.7-21.3 -15.5-15.1 21.4-3.1z"/>
    <path d="M336 122 l7.4 15 16.6 2.4 -12 11.7 2.8 16.5 -14.8-7.8 -14.8 7.8 2.8-16.5 -12-11.7 16.6-2.4z"/>
  </g>

  <!-- Le repère de carte : la destination -->
  <g filter="url(#ombre)">
    <path fill="url(#pin)"
      d="M256 446 C 256 446 140 344 140 258 a116 116 0 1 1 232 0 c0 86 -116 188 -116 188 z"/>
  </g>

  <circle cx="256" cy="252" r="88" fill="none" stroke="#1c8c9b" stroke-width="7"/>

  <!-- Quatre silhouettes : le voyage se décide à plusieurs -->
  <g fill="#1f3a6e" stroke="#1f3a6e" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(256 252) scale(1.16) translate(-256 -252)">
    <!-- Personne 1, bras levé, queue-de-cheval -->
    <g transform="translate(203 252)">
      <path d="M-8 -30 q -7 2 -8 9 q 4 -3 8 -3 z"/>
      <circle cx="0" cy="-30" r="8.5"/>
      <path d="M0 -20 v 22" stroke-width="12" fill="none"/>
      <path d="M0 2 l -7 20 M0 2 l 7 20" stroke-width="7" fill="none"/>
      <path d="M0 -15 l -12 -12" stroke-width="6" fill="none"/>
      <path d="M0 -13 l 9 12" stroke-width="6" fill="none"/>
    </g>
    <!-- Personne 2, sac à dos -->
    <g transform="translate(239 252)">
      <circle cx="0" cy="-32" r="8.5"/>
      <rect x="-13" y="-20" width="9" height="20" rx="4" opacity="0.85"/>
      <path d="M0 -22 v 24" stroke-width="12" fill="none"/>
      <path d="M0 2 l -8 21 M0 2 l 8 21" stroke-width="7" fill="none"/>
      <path d="M0 -15 l 10 13" stroke-width="6" fill="none"/>
    </g>
    <!-- Personne 3, queue-de-cheval -->
    <g transform="translate(273 252)">
      <path d="M8 -30 q 7 2 8 9 q -4 -3 -8 -3 z"/>
      <circle cx="0" cy="-30" r="8.5"/>
      <path d="M0 -20 v 22" stroke-width="12" fill="none"/>
      <path d="M0 2 l -8 20 M0 2 l 8 20" stroke-width="7" fill="none"/>
      <path d="M0 -14 l -10 12" stroke-width="6" fill="none"/>
    </g>
    <!-- Personne 4, bras levé, sac à dos -->
    <g transform="translate(309 252)">
      <circle cx="0" cy="-32" r="8.5"/>
      <rect x="4" y="-20" width="9" height="20" rx="4" opacity="0.85"/>
      <path d="M0 -22 v 24" stroke-width="12" fill="none"/>
      <path d="M0 2 l -8 21 M0 2 l 8 21" stroke-width="7" fill="none"/>
      <path d="M0 -17 l 13 -11" stroke-width="6" fill="none"/>
    </g>
  </g>

  <!-- Petit repère dans la pointe : l'itinéraire mène quelque part -->
  <path fill="#1c8c9b" d="M256 372 a15 15 0 0 1 15 15 c0 11 -15 25 -15 25 s-15 -14 -15 -25 a15 15 0 0 1 15 -15z"/>
  <circle cx="256" cy="387" r="5.5" fill="#ffffff"/>
</svg>
