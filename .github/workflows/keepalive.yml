name: Réveil Supabase

# Un projet Supabase gratuit se met en pause après 7 jours sans la moindre
# requête en base. Une vraie lecture tous les 3 jours suffit à l'en empêcher,
# et coûte quelques secondes de temps d'exécution GitHub par mois.
#
# Une tâche planifiée ne tourne que depuis la branche par défaut (`main`).
#
# L'adresse et la clé « anon » sont publiques : elles viennent de
# `apps/web/.env`, comme pour l'application. Les secrets SUPABASE_URL et
# SUPABASE_ANON_KEY (Settings → Secrets → Actions), s'ils existent, prennent
# le dessus — pour réveiller un autre projet que celui de l'application.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    name: Lecture d'entretien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/web/.env
          sparse-checkout-cone-mode: false

      - name: Interroger la base
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          lire() { sed -n "s/^$1=//p" apps/web/.env | tr -d '\r'; }
          URL=${URL:-$(lire VITE_SUPABASE_URL)}
          KEY=${KEY:-$(lire VITE_SUPABASE_ANON_KEY)}
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Ni secrets ni apps/web/.env : rien à réveiller pour l'instant."
            exit 0
          fi
          # Une requête qui touche réellement Postgres, pas seulement l'API.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/destinations?select=id&limit=1")
          echo "Réponse HTTP : $code"
          # 200 = réveillé, 401/403 = joignable mais filtré : dans les deux cas
          # la base a été sollicitée, ce qui est le but recherché.
          case "$code" in
            200|401|403) exit 0 ;;
            *) echo "Projet injoignable"; cat /tmp/out.json; exit 1 ;;
          esac
